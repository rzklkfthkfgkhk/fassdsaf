<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой плеер ArtPlayer</title>
    <style>
        /* Стили для страницы и контейнера плеера */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            font-family: sans-serif;
        }
        .player-wrapper {
            background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 800px;
        }
        /* Класс-контейнер для плеера. Важно: задайте размеры! */
        .artplayer-app {
            width: 100%;
            /* Используем соотношение сторон 16:9 */
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        .info {
            margin-top: 15px;
            color: #555;
            font-size: 14px;
            text-align: center;
        }
        .info a {
            color: #007bff;
            text-decoration: none;
        }
        .info a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="player-wrapper">
        <!-- Это контейнер, в котором будет отрисован плеер -->
        <div class="artplayer-app" id="player-container"></div>
        <div class="info">
            <strong>ArtPlayer</strong> · 
            <!-- Здесь можно добавить ссылку на ваше видео -->
            <a href="#" id="video-source-link">Источник видео</a>
        </div>
    </div>

    <!-- 1. Подключаем ArtPlayer с CDN -->
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>

    <!-- 2. Наш скрипт для инициализации плеера -->
    <script>
        // ВАЖНО: ВСТАВЬТЕ СЮДА ВАШУ ССЫЛКУ НА ВИДЕО!
        // Ссылка должна вести на файл .mp4, .webm или .m3u8 (HLS)
        const YOUR_VIDEO_URL = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';

        // Находим контейнер для плеера
        const container = document.getElementById('player-container');

        // Создаём экземпляр плеера
        const art = new Artplayer({
            container: container,
            url: YOUR_VIDEO_URL,
            // Настройки качества (опционально)
            quality: [
                {
                    default: true,
                    name: '1080P',
                    url: YOUR_VIDEO_URL,
                },
                // Можно добавить другие качества
            ],
            // Настройки субтитров (опционально)
            // subtitle: {
            //     url: 'path/to/subtitle.vtt',
            //     encoding: 'utf-8',
            // },
            // Настройки автозапуска (по умолчанию false)
            autoplay: false,
            // Настройки управления громкостью
            volume: 0.7,
            // Настройки скорости воспроизведения
            playbackRate: [0.5, 0.75, 1.0, 1.25, 1.5, 2.0],
            // Включаем настройки для мобильных устройств
            setting: true,
            // Показываем горячие клавиши
            hotkey: true,
            // Язык интерфейса (ru или en)
            lang: 'ru',
        });

        // Добавляем обработчик для корректного изменения размеров (опционально)
        // Это может понадобиться, если контейнер меняет размер
        // window.addEventListener('resize', () => art.resize());

        // Выводим сообщение в консоль, что плеер создан
        console.log('Плеер ArtPlayer создан:', art);

        // Обновляем ссылку в информации (для наглядности)
        const sourceLink = document.getElementById('video-source-link');
        if (sourceLink) {
            sourceLink.href = YOUR_VIDEO_URL;
            sourceLink.textContent = YOUR_VIDEO_URL.length > 40 ? YOUR_VIDEO_URL.substring(0, 40) + '...' : YOUR_VIDEO_URL;
            sourceLink.target = '_blank';
        }
    </script>
</body>
</html>
