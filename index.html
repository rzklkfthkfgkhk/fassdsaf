<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniList · аниме плеер</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar">
    <div class="logo">🎬 AniList</div>
    <div class="nav-links">
      <a href="#" id="homeLink">Главная</a>
      <a href="#" id="profileLink" style="display: none;">Профиль</a>
      <button id="themeToggle">🎨 Тема</button>
      <button id="loginBtn">Войти</button>
      <button id="logoutBtn" style="display: none;">Выйти</button>
    </div>
  </nav>

  <div id="searchContainer" style="max-width: 1300px; margin: 1rem auto 0; padding: 0 1.5rem;">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Поиск аниме по названию..." />
      <button id="searchBtn">🔍 Найти</button>
      <button id="clearSearchBtn" style="display: none;">✕ Очистить</button>
    </div>
  </div>

  <main id="app">
    <div id="pageContainer"></div>
  </main>

  <!-- Модалки -->
  <div id="authModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2 id="authTitle">Вход</h2>
      <form id="authForm">
        <input type="text" id="authUsername" placeholder="Имя пользователя" required />
        <input type="password" id="authPassword" placeholder="Пароль" required />
        <button type="submit" id="authSubmitBtn">Войти</button>
        <p id="authToggleText">Нет аккаунта? <a href="#" id="authToggleLink">Зарегистрироваться</a></p>
      </form>
    </div>
  </div>

  <div id="avatarModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close-avatar">&times;</span>
      <h2>Загрузить аватар</h2>
      <input type="file" id="avatarInput" accept="image/*" />
      <button id="avatarSaveBtn">Сохранить</button>
    </div>
  </div>

  <div id="vkSettingsModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close-vk">&times;</span>
      <h2>Настройки VK</h2>
      <p style="font-size:0.9rem; opacity:0.8; margin-bottom:1rem;">
        Введите <strong>сервисный ключ</strong> (service token) от вашего приложения VK.
        <br><a href="https://vk.com/apps?act=manage" target="_blank">Создать приложение и получить ключ</a>
      </p>
      <input type="text" id="vkTokenInput" placeholder="vk1.a...." style="width:100%; padding:0.8rem; border-radius:40px; border:1px solid #d1d9e6;" />
      <button id="vkTokenSaveBtn" style="margin-top:1rem; background:#3b82f6; color:white; width:100%;">Сохранить</button>
      <div id="vkTokenStatus" style="margin-top:0.5rem; font-size:0.9rem;"></div>
    </div>
  </div>

  <div id="themeModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close-theme">&times;</span>
      <h2>Выберите тему</h2>
      <div class="theme-picker">
        <button class="theme-option" data-theme="light" style="background:#f6f9fc; border:2px solid #1e293b;">☀️ Светлая</button>
        <button class="theme-option" data-theme="dark" style="background:#0b1120; border:2px solid #e2e8f0; color:#e2e8f0;">🌙 Тёмная</button>
        <button class="theme-option" data-theme="blue" style="background:#1e3a5f; border:2px solid #60a5fa; color:#dbeafe;">🔵 Синяя</button>
        <button class="theme-option" data-theme="green" style="background:#064e3b; border:2px solid #34d399; color:#d1fae5;">🟢 Зелёная</button>
        <button class="theme-option" data-theme="purple" style="background:#3b0764; border:2px solid #a78bfa; color:#ede9fe;">🟣 Фиолетовая</button>
        <button class="theme-option" data-theme="orange" style="background:#7c2d12; border:2px solid #fb923c; color:#ffedd5;">🟠 Оранжевая</button>
        <button class="theme-option" data-theme="pink" style="background:#4c0519; border:2px solid #f472b6; color:#fce7f3;">🩷 Розовая</button>
        <button class="theme-option" data-theme="teal" style="background:#042f2e; border:2px solid #2dd4bf; color:#ccfbf1;">💚 Бирюзовая</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
