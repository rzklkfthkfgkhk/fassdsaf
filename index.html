<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🎬 Моё аниме</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }
        .header h1 {
            color: #e94560;
            font-size: 28px;
            white-space: nowrap;
        }
        .header input {
            flex: 1;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid #333;
            background: #1a1a2e;
            color: white;
            font-size: 16px;
            min-width: 200px;
        }
        .header input:focus {
            outline: none;
            border-color: #e94560;
        }
        .header button {
            padding: 12px 30px;
            border-radius: 25px;
            border: none;
            background: #e94560;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .header button:hover {
            background: #ff6b81;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }
        .card {
            background: #1a1a2e;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid #2a2a3e;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.3);
        }
        .card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }
        .card .info {
            padding: 12px;
        }
        .card .info h3 {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card .info .orig {
            font-size: 12px;
            color: #888;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }
        .modal-content {
            max-width: 900px;
            margin: 20px auto;
            background: #1a1a2e;
            border-radius: 16px;
            padding: 25px;
            position: relative;
        }
        .close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 32px;
            cursor: pointer;
            color: #888;
            transition: 0.3s;
            z-index: 10;
        }
        .close:hover { color: #e94560; }
        
        .modal-grid {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 25px;
        }
        .modal-grid img {
            width: 100%;
            border-radius: 10px;
        }
        .modal-grid h2 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .modal-grid .orig-title {
            color: #888;
            margin-bottom: 15px;
        }
        .modal-grid .description {
            color: #aaa;
            font-size: 14px;
            line-height: 1.6;
            max-height: 150px;
            overflow-y: auto;
            margin: 10px 0;
        }
        
        .episodes {
            margin: 15px 0;
        }
        .episode-btn {
            padding: 8px 16px;
            margin: 4px;
            background: #0a0a0f;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
        }
        .episode-btn:hover {
            background: #e94560;
            border-color: #e94560;
        }
        
        .translations {
            margin: 10px 0;
        }
        .trans-btn {
            padding: 5px 15px;
            margin: 3px;
            background: #0a0a0f;
            border: 1px solid #333;
            border-radius: 15px;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
        }
        .trans-btn.active {
            background: #e94560;
            border-color: #e94560;
        }
        
        .player-container {
            margin-top: 20px;
            aspect-ratio: 16/9;
            background: black;
            border-radius: 10px;
            overflow: hidden;
        }
        .player-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
            grid-column: 1/-1;
        }
        
        .no-results {
            text-align: center;
            padding: 60px;
            color: #666;
            grid-column: 1/-1;
        }
        .no-results i {
            font-size: 48px;
            margin-bottom: 15px;
            display: block;
        }
        
        .season-title {
            margin: 15px 0 8px 0;
            color: #e94560;
            font-size: 16px;
        }
        
        .player-info {
            color: #888;
            font-size: 14px;
            margin-top: 10px;
        }
        
        @media (max-width: 600px) {
            .modal-grid {
                grid-template-columns: 1fr;
            }
            .modal-grid img {
                max-width: 200px;
                margin: 0 auto;
            }
            .header h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎬 Аниме</h1>
        <input type="text" id="searchInput" placeholder="Поиск аниме..." />
        <button id="searchBtn">🔍 Найти</button>
        <button id="testBtn" style="background: #333; padding: 12px 20px;">🧪 Тест</button>
    </div>
    <div id="grid" class="grid">
        <div class="loading">⏳ Введите название и нажмите "Найти"</div>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close" id="closeModal">&times;</span>
        <div id="modalBody"></div>
    </div>
</div>

<script>
const API_URL = 'http://localhost:5000/api';
const grid = document.getElementById('grid');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const testBtn = document.getElementById('testBtn');
const modal = document.getElementById('modal');
const modalBody = document.getElementById('modalBody');
const closeModal = document.getElementById('closeModal');

// ===== ТЕСТОВАЯ ФУНКЦИЯ =====
testBtn.addEventListener('click', async () => {
    try {
        const response = await fetch(`${API_URL}/test`);
        const data = await response.json();
        alert(`✅ Сервер работает!\n${data.message}\nAPI ключ: ${data.api_key}`);
    } catch (error) {
        alert(`❌ Ошибка: ${error.message}\nУбедитесь, что сервер запущен!`);
    }
});

// ===== ПОИСК =====
searchBtn.addEventListener('click', searchAnime);
searchInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') searchAnime();
});

async function searchAnime() {
    const title = searchInput.value.trim();
    if (!title) {
        grid.innerHTML = '<div class="no-results"><i>✏️</i>Введите название аниме</div>';
        return;
    }
    
    grid.innerHTML = '<div class="loading">⏳ Загрузка...</div>';
    
    try {
        const response = await fetch(`${API_URL}/search`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: title })
        });
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        
        const data = await response.json();
        console.log('📦 Данные от API:', data);
        
        if (data.error) {
            throw new Error(data.error);
        }
        
        if (!data.results || data.results.length === 0) {
            grid.innerHTML = `<div class="no-results"><i>😔</i>Ничего не найдено по запросу "${title}"</div>`;
            return;
        }
        
        renderAnime(data.results);
    } catch (error) {
        console.error('❌ Ошибка:', error);
        grid.innerHTML = `
            <div class="no-results">
                <i>❌</i>
                Ошибка: ${error.message}
                <br><small>Убедитесь, что сервер запущен и API ключ правильный</small>
                <br><small>Нажмите "🧪 Тест" для проверки</small>
            </div>
        `;
    }
}

// ===== ОТОБРАЖЕНИЕ =====
function renderAnime(animeList) {
    grid.innerHTML = animeList.map(anime => `
        <div class="card" data-anime='${JSON.stringify(anime).replace(/'/g, "&#39;")}'>
            <img src="${anime.poster || 'https://via.placeholder.com/180x260/1a1a2e/666?text=No+Image'}" 
                 alt="${anime.title}"
                 onerror="this.src='https://via.placeholder.com/180x260/1a1a2e/666?text=No+Image'" />
            <div class="info">
                <h3>${anime.title}</h3>
                <div class="orig">${anime.title_orig || ''}</div>
                ${anime.year ? `<div style="color: #666; font-size: 12px;">${anime.year}</div>` : ''}
            </div>
        </div>
    `).join('');

    document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => {
            try {
                const animeData = JSON.parse(card.dataset.anime);
                openAnime(animeData);
            } catch (e) {
                console.error('Ошибка парсинга:', e);
            }
        });
    });
}

// ===== ОТКРЫТЬ АНИМЕ =====
let currentAnime = null;
let selectedTranslation = null;

function openAnime(anime) {
    modal.style.display = 'block';
    currentAnime = anime;
    
    // Выбираем первую озвучку по умолчанию
    const translations = anime.translations || [];
    selectedTranslation = translations.length > 0 ? translations[0].id : null;
    
    showAnimeDetails(anime);
}

function showAnimeDetails(anime) {
    const translations = anime.translations || [];
    const seasons = anime.seasons || [];
    const hasSeasons = seasons.length > 0;
    const hasEpisodes = seasons.some(s => s.episodes && s.episodes.length > 0);
    
    modalBody.innerHTML = `
        <div class="modal-grid">
            <div>
                <img src="${anime.poster || 'https://via.placeholder.com/200x280/1a1a2e/666?text=No+Image'}" 
                     alt="${anime.title}"
                     onerror="this.src='https://via.placeholder.com/200x280/1a1a2e/666?text=No+Image'" />
                ${anime.year ? `<div style="margin-top:10px; color:#888;">📅 ${anime.year}</div>` : ''}
                ${anime.genres && anime.genres.length > 0 ? 
                    `<div style="margin-top:5px; color:#e94560; font-size:13px;">${anime.genres.slice(0, 3).join(', ')}</div>` : ''}
            </div>
            <div>
                <h2>${anime.title}</h2>
                <div class="orig-title">${anime.title_orig || ''}</div>
                ${anime.description ? `<div class="description">${anime.description}</div>` : ''}
                
                ${translations.length > 0 ? `
                    <div class="translations">
                        <strong>🎙️ Озвучка:</strong><br>
                        ${translations.map(t => `
                            <button class="trans-btn ${selectedTranslation === t.id ? 'active' : ''}" 
                                    data-trans-id="${t.id}">${t.title || t.id}</button>
                        `).join('')}
                    </div>
                ` : '<div style="color:#888; margin:10px 0;">🎙️ Озвучка не указана</div>'}
                
                ${hasEpisodes ? `
                    <div class="episodes">
                        <strong>📺 Серии:</strong>
                        ${seasons.map(season => `
                            <div>
                                <div class="season-title">Сезон ${season.number || 1}</div>
                                ${season.episodes && season.episodes.length > 0 ? 
                                    season.episodes.map(ep => `
                                        <button class="episode-btn" 
                                                data-season="${season.number || 1}" 
                                                data-episode="${ep.number || ep}">${ep.number || ep}</button>
                                    `).join('') 
                                    : '<span style="color:#666; font-size:13px;">Нет серий</span>'}
                            </div>
                        `).join('')}
                    </div>
                ` : `
                    <div style="color:#888; margin:15px 0;">
                        📺 Информация о сериях отсутствует
                        ${!hasSeasons ? '<br><small>Возможно, это фильм или у аниме нет серий</small>' : ''}
                    </div>
                `}
            </div>
        </div>
        <div id="playerContainer"></div>
    `;

    // ===== СОБЫТИЯ =====
    
    // Выбор озвучки
    document.querySelectorAll('.trans-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.trans-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedTranslation = parseInt(btn.dataset.transId);
        });
    });

    // Клик по серии
    document.querySelectorAll('.episode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const season = btn.dataset.season;
            const episode = btn.dataset.episode;
            const materialId = anime.material_data?.id || anime.id;
            
            if (materialId) {
                playEpisode(materialId, season, episode);
            } else {
                alert('❌ Нет ID для плеера');
                console.error('Нет material_id для:', anime);
            }
        });
    });
}

// ===== ПЛЕЕР =====
async function playEpisode(materialId, season, episode) {
    const container = document.getElementById('playerContainer');
    container.innerHTML = '<div style="text-align:center; padding:20px; color:#888;">⏳ Загрузка плеера...</div>';

    try {
        let url = `${API_URL}/player?material_id=${materialId}&season=${season}&episode=${episode}`;
        if (selectedTranslation) {
            url += `&translation=${selectedTranslation}`;
        }

        console.log('🎬 Запрос плеера:', url);
        const response = await fetch(url);
        const data = await response.json();

        if (data.url) {
            container.innerHTML = `
                <div class="player-container">
                    <iframe src="${data.url}" 
                            allowfullscreen 
                            allow="autoplay; encrypted-media"
                            frameborder="0">
                    </iframe>
                </div>
                <div class="player-info">
                    🎬 Сезон ${season}, Серия ${episode}
                    ${currentAnime?.title ? `| ${currentAnime.title}` : ''}
                    ${selectedTranslation ? `| Перевод #${selectedTranslation}` : ''}
                </div>
            `;
        } else {
            container.innerHTML = `<p style="color:#888;">❌ Не удалось загрузить плеер: ${data.error || 'неизвестная ошибка'}</p>`;
        }
    } catch (error) {
        console.error('Ошибка плеера:', error);
        container.innerHTML = `<p style="color:#888;">❌ Ошибка загрузки плеера: ${error.message}</p>`;
    }
}

// ===== ЗАКРЫТИЕ МОДАЛКИ =====
closeModal.addEventListener('click', () => {
    modal.style.display = 'none';
    // Останавливаем видео при закрытии
    const iframe = document.querySelector('.player-container iframe');
    if (iframe) {
        iframe.src = '';
    }
});

window.addEventListener('click', (e) => {
    if (e.target === modal) {
        modal.style.display = 'none';
        const iframe = document.querySelector('.player-container iframe');
        if (iframe) {
            iframe.src = '';
        }
    }
});

console.log('🎬 Аниме сайт готов!');
console.log('📡 Использует API: https://kodik-api.com');
console.log('🔍 Введите название и нажмите "Найти"');
</script>
</body>
</html>
